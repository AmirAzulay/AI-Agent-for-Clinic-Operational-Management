name: clinic-agent

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
      POSTGRES_USER: ${POSTGRES_USER:-clinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinic}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinic} -d ${POSTGRES_DB:-clinic}"]
      interval: 5s
      timeout: 5s
      retries: 10

  clinic-app:
    build:
      context: .
      dockerfile: clinic-app/Dockerfile
    image: clinic-agent/clinic-app:local
    environment:
      CLINIC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-clinic}
      CLINIC_DB_USER: ${POSTGRES_USER:-clinic}
      CLINIC_DB_PASSWORD: ${POSTGRES_PASSWORD:-clinic}
      JWT_SECRET: ${JWT_SECRET:-clinic-agent-dev-secret-change-me-0123456789abcdef}
      JWT_TTL: ${JWT_TTL:-8h}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
